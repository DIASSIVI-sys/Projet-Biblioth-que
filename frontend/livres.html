<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Livres - Bibliothèque</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body data-page="livres">

  <button id="menu-toggle" class="menu-toggle">
    <i class="fa-solid fa-bars"></i>
  </button>

  <div id="sidebar-container"></div>

  <main class="content">
    <div class="page-header">
      <h1><i class="fa-solid fa-book"></i> Gestion des livres</h1>
      <button id="btn-ouvrir-modal" class="btn-principal">
        <i class="fa-solid fa-plus"></i> Ajouter un livre
      </button>
    </div>

    <div class="search-section">
      <input type="text" id="recherche" placeholder="Rechercher par titre ou auteur...">
      <button id="btn-recherche"><i class="fa-solid fa-magnifying-glass"></i> Rechercher</button>
    </div>

    <table id="livres-table">
      <thead>
        <tr>
          <th>Titre</th>
          <th>Auteur</th>
          <th>Année</th>
          <th>Statut</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="livres-body"></tbody>
    </table>

    <div class="pagination">
      <button id="btn-precedent"><i class="fa-solid fa-chevron-left"></i> Précédent</button>
      <span id="page-actuelle">Page 1</span>
      <button id="btn-suivant">Suivant <i class="fa-solid fa-chevron-right"></i></button>
    </div>
  </main>

  <!-- Modale ajout / modification -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-titre"><i class="fa-solid fa-book"></i> Ajouter un livre</h2>
        <button id="btn-fermer-modal" class="btn-fermer"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="form-livre">
        <input type="hidden" id="livre-id">
        <input type="text" id="titre" placeholder="Titre" required>
        <input type="number" id="annee_publication" placeholder="Année de publication">
        <select id="id_auteur" required>
          <option value="">-- Choisir un auteur --</option>
        </select>
        <button type="submit" id="btn-submit-livre" class="btn-principal">
          <i class="fa-solid fa-check"></i> Ajouter
        </button>
      </form>
      <p id="livre-message"></p>
    </div>
  </div>

  <script src="assets/js/sidebar.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/livres.js"></script>
</body>
</html>
