<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Tableau de bord - Bibliothèque</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="index">

  <div id="sidebar-container"></div>

  <main class="content">
    <h1>Tableau de bord</h1>

    <div class="stats-grid">
      <div class="stat-card">
        <h3>Livres</h3>
        <p id="stat-livres">-</p>
      </div>
      <div class="stat-card">
        <h3>Adhérents</h3>
        <p id="stat-adherents">-</p>
      </div>
      <div class="stat-card">
        <h3>Emprunts en cours</h3>
        <p id="stat-en-cours">-</p>
      </div>
      <div class="stat-card stat-card-alerte">
        <h3>Emprunts en retard</h3>
        <p id="stat-en-retard">-</p>
      </div>
    </div>

    <div class="stats-highlight">
      <div class="highlight-card">
        <h3>📖 Livre le plus emprunté</h3>
        <p id="stat-livre-populaire">Aucune donnée</p>
      </div>
      <div class="highlight-card">
        <h3>👤 Adhérent le plus actif</h3>
        <p id="stat-adherent-actif">Aucune donnée</p>
      </div>
    </div>
  </main>

  <script src="./assets/js/sidebar.js"></script>
  <script src="./assets/js/config.js"></script>
  <script src="./assets/js/stats.js"></script>
</body>
</html>
